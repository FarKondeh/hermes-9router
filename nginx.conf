# Relative to nginx --prefix (matches Debian's packaged config:
# /usr/share/nginx/modules-available/mod-http-js.conf uses the same form).
load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/nginx_access.log;

    sendfile on;
    keepalive_timeout 65;

    # Generic /<port>/ path-prefix rewriter (optional auto-mount mode).
    # Only used by the /<port>/ location if you enable it; does NOT
    # touch the primary root.
    # Absolute path (Dockerfile copies the script to /etc/nginx/njs/).
    js_import prefix_rewrite from /etc/nginx/njs/prefix_rewrite.js;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 7860 default_server;
        server_name _;

        # ── Primary app (served at "/", no prefix) ──────────────
        # Reads the active port from /etc/nginx/active_port.conf
        # (managed by scripts/set-primary-port.sh).
        # 1 == no primary port → proxied to dead port 1 → 502 →
        # transparently falls back to the landing page.
        location / {
            include /etc/nginx/active_port.conf;

            proxy_pass http://127.0.0.1:$active_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_intercept_errors on;
            error_page 502 504 = @landing_fallback;
        }

        location @landing_fallback {
            root /app/static;
            try_files /index.html =404;
        }

        # ── Agent-controlled ports (agent decides what runs where) ─
        # Any request whose first path segment is a number >= 1024
        # (e.g. /9005/..., /3000/..., /50000/...) is forwarded to
        # 127.0.0.1:<that number>/...
        #
        # SIMPLE proxy (like the agent's version): no body-filter /
        # cookie_path / Accept-Encoding rewriting, so it works correctly
        # when the user manually prepends /<port>/ to their config paths.
        #
        # OPTIONAL AUTO-MOUNT MODE: if you do NOT manually add /<port>/,
        # uncomment the three lines below and nginx will auto-rewrite
        # absolute paths + scope cookies under /<port>/ for you.
        # (Do NOT also prepend /<port>/ manually then — double rewrite.)
        location ~ "^/(?!(?:[0-9]{1,3}|10[01][0-9]|102[0-3])(?:/|$))(\d+)(/.*)?$" {
            proxy_pass http://127.0.0.1:$1$2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /$1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_redirect http://127.0.0.1:$1/ $scheme://$host/$1/;
            proxy_redirect / $scheme://$host/$1/;

            # proxy_set_header Accept-Encoding "";
            # proxy_cookie_path / /$1/;
            # js_body_filter prefix_rewrite.bodyFilter buffer_type=string;
        }
    }
}
