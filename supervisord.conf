[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; entrypoint.sh may drop extra program files here at runtime (e.g. a
; 9router.conf, only when it auto-provisioned an LLM key). A missing or
; empty directory here is not an error — the glob just matches nothing.
[include]
files = /etc/supervisor/extra.d/*.conf

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/tmp/nginx_stdout.log
stderr_logfile=/tmp/nginx_stderr.log

[program:hermes-gateway]
command=/opt/venv/bin/hermes gateway
directory=/app
environment=HERMES_HOME="/data/.hermes",HOME="/data",PYTHONUNBUFFERED="1",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/tmp/hermes_gateway_stdout.log
stderr_logfile=/tmp/hermes_gateway_stderr.log

[program:hermes-agent]
command=/opt/venv/bin/python -m uvicorn scripts.agent_server.main:app --host 127.0.0.1 --port 9001
directory=/app
environment=HERMES_HOME="/data/.hermes",HOME="/data",PYTHONUNBUFFERED="1",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/tmp/hermes_agent_stdout.log
stderr_logfile=/tmp/hermes_agent_stderr.log
